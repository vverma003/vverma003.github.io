<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dr. Vishwajeet Verma | Portfolio</title>
  
  <!-- Fonts & Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  
  <!-- Stylesheet -->
  <link rel="stylesheet" href="css/style.css" />

  <!-- GoatCounter Script with Hash / Tab Tracking Enabled -->
  <script data-goatcounter="https://vverma003.goatcounter.com/count"
        data-goatcounter-settings='{"allow_local": true, "no_events": false}'
        async src="//gc.zgo.at/count.js"></script>
</head>

<body>

  <!-- Floating "Write to Me" Button -->
  <button class="floating-chat-btn" onclick="openModal('write-to-me-modal')" aria-label="Write to Me">
    <i class="fa-solid fa-paper-plane"></i>
    <span class="floating-chat-text">Write to Me</span>
  </button>

  <!-- Write To Me Modal -->
  <div id="write-to-me-modal" class="modal-overlay" onclick="closeModalOutside(event, 'write-to-me-modal')">
    <div class="modal-container" style="max-width: 500px;">
      <div class="modal-header">
        <div class="modal-title"><i class="fa-solid fa-paper-plane"></i> Write to Me</div>
        <button class="modal-close" onclick="closeModal('write-to-me-modal')">&times;</button>
      </div>
      <div class="modal-body">
        <form id="contact-form" action="https://formspree.io/f/moeqapnw" method="POST">
          <div class="comment-input-box">
            <input type="text" name="name" placeholder="Your Name" required>
            <input type="email" name="email" placeholder="Your Email" required>
            <textarea name="message" rows="4" placeholder="Your Message..." required></textarea>
            <button type="submit" class="comment-submit-btn" style="width: 100%; padding: 0.6rem;">Send Message</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Static Sidebar -->
  <aside class="sidebar">
    <div class="profile-header">
      <div class="avatar-wrapper">
        <img class="avatar-img" src="assets/profile.JPG" alt="Dr. Vishwajeet Verma">
      </div>
      <h1>Dr. Vishwajeet Verma</h1>
      <p class="subtitle">Postdoctoral Research Fellow</p>

      <div class="location-tag">
        <a href="https://maps.app.goo.gl/3y4cLnfYXkGXPgs98" target="_blank" rel="noopener noreferrer" class="location-link" title="Open Trinity College Dublin in Google Maps">
          <i class="fa-solid fa-location-dot"></i> Trinity College Dublin, Ireland
        </a>
      </div>

      <p class="bio-snippet">
        Studying Public Transport, Micro-mobility, Gender Mainstreaming and Data-driven based Mobility Research.
      </p>
    </div>

    <!-- Pinned Bottom Container -->
    <div class="sidebar-bottom">
      <!-- CV View Button -->
      <div class="cv-container">
        <button type="button" onclick="openModal('cv-modal')" class="cv-btn">
          <i class="fa-solid fa-file-pdf"></i> View CV
        </button>
      </div>

      <!-- Email Address Display -->
      <div class="email-container">
        <a href="mailto:vermavk@tcd.ie" class="email-btn" title="Send Email">
          <i class="fa-solid fa-envelope"></i> vermavk@tcd.ie
        </a>
      </div>

      <!-- Social Icons -->
      <div class="social-links">
        <a href="https://scholar.google.com/citations?user=uMwPCy0AAAAJ&hl=en" target="_blank" rel="noopener" class="social-btn" title="Google Scholar"><i class="fa-brands fa-google-scholar"></i></a>
        <a href="https://www.researchgate.net/profile/Vishwajeet-Verma-2" target="_blank" rel="noopener" class="social-btn" title="ResearchGate"><i class="fa-brands fa-researchgate"></i></a>
        <a href="https://www.linkedin.com/in/vverma003/" target="_blank" rel="noopener" class="social-btn" title="LinkedIn"><i class="fa-brands fa-linkedin-in"></i></a>
        <a href="https://github.com/vverma003" target="_blank" rel="noopener" class="social-btn" title="GitHub"><i class="fa-brands fa-github"></i></a>
        <a href="https://x.com/vverma003" target="_blank" rel="noopener" class="social-btn" title="X (Twitter)"><i class="fa-brands fa-x-twitter"></i></a>
        <a href="https://instagram.com/vverma003" target="_blank" rel="noopener" class="social-btn" title="Instagram"><i class="fa-brands fa-instagram"></i></a>
        <a href="https://facebook.com/vverma003" target="_blank" rel="noopener" class="social-btn" title="Facebook"><i class="fa-brands fa-facebook-f"></i></a>
      </div>
    </div>
  </aside>

  <!-- Modal Container for CV -->
  <div id="cv-modal" class="modal-overlay" onclick="closeModalOutside(event, 'cv-modal')">
    <div class="modal-container cv-modal-container">
      <div class="modal-header">
        <div class="modal-title">
          <i class="fa-solid fa-file-pdf"></i> Curriculum Vitae
        </div>
        <div class="modal-header-actions">
          <a href="assets/CV_V.Verma.pdf" download class="modal-download-btn" title="Download PDF">
            <i class="fa-solid fa-download"></i> Download
          </a>
          <button class="modal-close" onclick="closeModal('cv-modal')">&times;</button>
        </div>
      </div>
      <div class="modal-body cv-modal-body">
        <iframe src="assets/CV_V.Verma.pdf" width="100%" height="100%" frameborder="0"></iframe>
      </div>
    </div>
  </div>

  <!-- Main Content Wrapper -->
  <div class="main-wrapper">
    
    <!-- Top Bar Navigation with Hamburger Icon -->
    <nav class="navbar">
      <button class="menu-toggle" id="menu-toggle" aria-label="Toggle navigation">
        <i class="fa-solid fa-bars"></i>
      </button>

      <ul class="nav-tabs" id="nav-tabs">
        <li><button class="tab-btn active" onclick="loadTab('about', event)">About</button></li>
        <li><button class="tab-btn" onclick="loadTab('research', event)">Research</button></li>
        <li><button class="tab-btn" onclick="loadTab('projects', event)">Projects</button></li>
        <li><button class="tab-btn" onclick="loadTab('publications', event)">Publications</button></li>
        <li><button class="tab-btn" onclick="loadTab('talks', event)">Talks & Teachings</button></li>
        <li><button class="tab-btn" onclick="loadTab('news', event)">News</button></li>
        <li><button class="tab-btn" onclick="loadTab('blog', event)">Blog</button></li>
      </ul>
    </nav>

    <!-- Content Area where tab pages load dynamically -->
    <main class="content-container" id="content-area">
      <!-- Active tab content injects here dynamically -->
    </main>

    <!-- Footer -->
    <footer>
      &copy; Dr. Vishwajeet Verma. All Rights Reserved.
    </footer>
  </div>

  <!-- Scripts -->
  <script type="module" src="js/main.js"></script>
</body>
</html>

name: Update Google Scholar Metrics

on:
  schedule:
    # Runs every Sunday at midnight UTC
    - cron: '0 0 * * 0'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  update-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Grants permission to commit back to the repository

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install scholarly

      - name: Fetch Scholar Data
        run: python update_metrics.py

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add metrics.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-update scholar metrics" && git push)